<text x="56" y="309" font-size="10" fill="#9DB1BA" letter-spacing="1.3">DETACH   /   REATTACH   /   SEARCH   /   HAND OFF</text>
<text x="810" y="111" font-size="18" fill="#9CE1C1" >&gt; ax run --detach</text><path d="M810 131L1119 131" fill="none" stroke="#304352" stroke-width="2" /><rect x="829" y="153" width="171" height="4" rx="2" fill="#647888" stroke="none"/><rect x="829" y="175" width="248" height="4" rx="2" fill="#647888" stroke="none"/><rect x="829" y="197" width="203" height="4" rx="2" fill="#304352" stroke="none"/><rect x="829" y="219" width="111" height="4" rx="2" fill="#304352" stroke="none"/><text x="810" y="257" font-size="18" fill="#9CE1C1" >&gt; ax attach</text><rect x="950" y="244" width="10" height="18" rx="1" fill="#9CE1C1" stroke="none"/><path d="M1098 100H1126V262H1098" fill="none" stroke="#9CE1C1" stroke-width="2"/><circle cx="1126" cy="181" r="5" fill="#9CE1C1" stroke="none" stroke-width="1"/><text x="811" y="294" font-size="11" fill="#647888" >ONE PROCESS / MANY TERMINALS</text>
