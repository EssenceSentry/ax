<text x="86" y="70" font-size="11" fill="#BDCACD" letter-spacing="1.8">LOCAL WORKBENCH / CLAUDE + CODEX</text>
<text x="52" y="160" font-size="64" fill="#EEF2ED" font-weight="700" letter-spacing="-2">ax</text>
